name: Publish Academic API runtime

on:
  push:
    branches:
      - codex/academic-runtime-ghcr-b2f489f

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/sherydans12/edupay-academico
  SOURCE_SHA: b2f489f3bfbb67da8fc8ff71be7ea551e1de27c9
  RELEASE_BRANCH: codex/academic-runtime-ghcr-b2f489f

jobs:
  publish:
    if: github.ref == 'refs/heads/codex/academic-runtime-ghcr-b2f489f'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$SOURCE_SHA^{tree}")"

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Log in to GHCR with GITHUB_TOKEN
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable source tag
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: deploy/Dockerfile.api
          target: runtime
          push: true
          tags: ${{ env.IMAGE_NAME }}:commit-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            com.edupay.source-sha=${{ env.SOURCE_SHA }}
            com.edupay.revision=${{ env.SOURCE_SHA }}
          sbom: true
          provenance: mode=max

      - name: Record published digest without credentials
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.build.outputs.digest }}" in
            sha256:*) ;;
            *) echo "Build did not return an immutable digest" >&2; exit 1 ;;
          esac
          {
            echo "### Academic runtime publication"
            echo "- package: \\`${IMAGE_NAME}\`"
            echo "- source: \\`${SOURCE_SHA}\`"
            echo "- digest: \\`${{ steps.build.outputs.digest }}\`"
            echo "- target: \\`runtime\`"
            echo "- SBOM: enabled"
            echo "- provenance: BuildKit mode=max"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAME: ghcr.io/sherydans12/edupay-academico
      SOURCE_SHA: b2f489f3bfbb67da8fc8ff71be7ea551e1de27c9
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Log in to GHCR with GITHUB_TOKEN
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image independently by digest
        shell: bash
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "Missing immutable digest" >&2; exit 1 ;;
          esac
          docker pull "${IMAGE_NAME}@${DIGEST}"

      - name: Verify OCI manifest, attestations, labels and runtime contract
        shell: bash
        run: |
          set -euo pipefail
          REF="${IMAGE_NAME}@${DIGEST}"
          manifest_file="$RUNNER_TEMP/academic-runtime-manifest.json"
          docker buildx imagetools inspect --raw "$REF" > "$manifest_file"

          jq -e '
            .schemaVersion == 2 and
            (.manifests | length >= 3) and
            any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            ([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length >= 2)
          ' "$manifest_file" > /dev/null

          revision="$(docker image inspect "$REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          source_sha="$(docker image inspect "$REF" --format '{{index .Config.Labels "com.edupay.source-sha"}}')"
          custom_revision="$(docker image inspect "$REF" --format '{{index .Config.Labels "com.edupay.revision"}}')"
          test "$revision" = "$SOURCE_SHA"
          test "$source_sha" = "$SOURCE_SHA"
          test "$custom_revision" = "$SOURCE_SHA"

          command_json="$(docker image inspect "$REF" --format '{{json .Config.Cmd}}')"
          test "$command_json" = '["node","dist/main.js"]'

          health_json="$(docker image inspect "$REF" --format '{{json .Config.Healthcheck.Test}}')"
          printf '%s' "$health_json" | jq -e 'any(.[]; type == "string" and contains("/api/v1/health/ready"))' > /dev/null

          mapfile -t attestations < <(
            jq -r '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' "$manifest_file"
          )
          sbom_found=false
          provenance_found=false
          for attestation_digest in "${attestations[@]}"; do
            attestation_file="$RUNNER_TEMP/attestation-${attestation_digest#sha256:}.json"
            docker buildx imagetools inspect --raw "${IMAGE_NAME}@${attestation_digest}" > "$attestation_file"
            if jq -e 'any(.. | objects; .["in-toto.io/predicate-type"]? == "https://spdx.dev/Document")' "$attestation_file" > /dev/null; then
              sbom_found=true
            fi
            if jq -e 'any(.. | objects; (.["in-toto.io/predicate-type"]? // "") | startswith("https://slsa.dev/provenance/"))' "$attestation_file" > /dev/null; then
              provenance_found=true
            fi
          done
          test "$sbom_found" = true
          test "$provenance_found" = true

          {
            echo "### Academic runtime verification"
            echo "- package: \\`${IMAGE_NAME}\`"
            echo "- source: \\`${SOURCE_SHA}\`"
            echo "- digest: \\`${DIGEST}\`"
            echo "- OCI manifest: verified"
            echo "- pull by digest: verified"
            echo "- labels source/revision: verified"
            echo "- command: \\`node dist/main.js\`"
            echo "- healthcheck path: \\`/api/v1/health/ready\`"
            echo "- SBOM: verified"
            echo "- provenance: verified"
          } >> "$GITHUB_STEP_SUMMARY"
